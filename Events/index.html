<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | IEEE TAMUSA</title>
<meta name="description" content="Upcoming IEEE TAMUSA workshops, corporate mixers, and branch meetings at Texas A&M University-San Antonio.">
<meta property="og:title" content="Events | IEEE TAMUSA">
<meta property="og:description" content="Upcoming IEEE TAMUSA workshops, corporate mixers, and branch meetings at Texas A&M University-San Antonio.">
<meta property="og:site_name" content="IEEE TAMUSA">
<link rel="icon" href="/cropped-tamusa_bb_Logo-Black-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/site.js" defer></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main" class="page">
<p class="eyebrow">Events</p>
<h1>Upcoming events</h1>
<p class="page-intro">Workshops, mixers, and meetings coming up on campus. Times are shown in San Antonio time. <a href="/Newsletter">Get new events by email</a>.</p>

<div id="event-list" class="event-list"><div class="notice">Loading upcoming events...</div></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script>
const TZ = "America/Chicago";
function eventDate(e) {
  // All-day events arrive as a bare date (YYYY-MM-DD); format it in UTC so it doesn't slip a day.
  const opts = e.allDay
    ? {weekday:"long", month:"long", day:"numeric", year:"numeric", timeZone:"UTC"}
    : {weekday:"long", month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit", timeZone:TZ, timeZoneName:"short"};
  return new Date(e.start).toLocaleString("en-US", opts);
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}
function showNotice(list, text, isError) {
  list.replaceChildren(el("div", isError ? "notice form-status error" : "notice", text));
}
(async () => {
  const list = document.getElementById("event-list");
  try {
    const r = await fetch("/api/events");
    if (!r.ok) throw new Error();
    const {events} = await r.json();
    if (!events.length) return showNotice(list, "No upcoming events right now. Check Jagsync or Discord for the latest.");
    list.replaceChildren(...events.map(e => {
      const card = el("article", "event-card");
      const parts = new Date(e.start).toLocaleDateString("en-US", {month: "short", day: "numeric", timeZone: e.allDay ? "UTC" : TZ}).split(" ");
      const date = el("div", "event-date");
      date.setAttribute("aria-hidden", "true");
      date.append(el("span", "month", parts[0]), el("span", "day", parts[1]));
      card.append(date, el("h2", "eT", e.title), el("div", "event-meta", eventDate(e)));
      if (e.location) card.append(el("div", "event-meta", e.location));
      if (e.description) card.append(el("p", "", e.description));
      if (e.url) {
        const a = el("a", "button", "Details / RSVP");
        a.href = e.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        card.append(a);
      }
      return card;
    }));
  } catch {
    showNotice(list, "Events are temporarily unavailable.", true);
  }
})();
</script>
</body></html>
