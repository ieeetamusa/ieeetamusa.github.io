<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | IEEE TAMUSA</title>
<meta name="description" content="Contact the IEEE TAMUSA Student Branch about membership, events, sponsorship, or partnerships.">
<meta property="og:title" content="Contact | IEEE TAMUSA">
<meta property="og:description" content="Contact the IEEE TAMUSA Student Branch about membership, events, sponsorship, or partnerships.">
<meta property="og:site_name" content="IEEE TAMUSA">
<link rel="icon" href="/cropped-tamusa_bb_Logo-Black-32x32.png">
<link rel="stylesheet" href="/style.css">
<script src="/site.js" defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<header id="site-header" class="banner"></header>
<main id="main" class="page">
<h1>Contact IEEE TAMUSA</h1>
<p class="page-intro">Have a question about membership, events, sponsorship, resources, or partnerships? Send the branch a message.</p>
<form id="contact-form" class="form-card">
<div class="form-row"><label for="name">Name</label><input id="name" name="name" required maxlength="100" autocomplete="name"></div>
<div class="form-row"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div>
<div class="form-row"><label for="message">Message</label><textarea id="message" name="message" required maxlength="5000"></textarea></div>
<div class="honeypot" aria-hidden="true"><label>Leave this blank<input name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFJIP_6QnexWpE5w" data-theme="light"></div>
<button type="submit">Send Message</button>
<div id="contact-status" role="status"></div>
</form>
</main>
<footer id="site-footer" class="footer"></footer>
<script>
document.getElementById("contact-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form=ev.currentTarget, status=document.getElementById("contact-status");
  status.className="form-status"; status.textContent="Sending...";
  try {
    const r=await fetch("/api/contact",{method:"POST",body:new FormData(form)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || "Unable to send your message.");
    status.className="form-status success"; status.textContent="Thanks! Your message has been sent.";
    form.reset();
  } catch(e) { status.className="form-status error"; status.textContent=e.message; }
  turnstile.reset(); // tokens are single-use
});
</script>
</body></html>
