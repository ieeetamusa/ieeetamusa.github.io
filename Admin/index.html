<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Portal | IEEE TAMUSA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/cropped-tamusa_bb_Logo-Black-32x32.png">
<link rel="stylesheet" href="/style.css">
<script src="/site.js" defer></script>
</head>
<body>
<header id="site-header" class="banner"></header>
<main id="main" class="page">
<h1>IEEE TAMUSA Official Portal</h1>
<div id="login-box" class="form-card">
<h2>Official Login</h2>
<form id="login-form">
<div class="form-row"><label>Username<input name="username" required autocomplete="username"></label></div>
<div class="form-row"><label>Password<input name="password" type="password" required autocomplete="current-password"></label></div>
<button>Sign In</button><div id="login-status" role="status"></div>
</form>
</div>
<div id="portal" hidden>
<div class="admin-nav"><button id="logout" class="button secondary">Sign Out</button></div>
<h2>Post a Resource</h2>
<form id="resource-form" class="form-card form-card-left">
<div class="form-row"><label>Title<input name="title" maxlength="200" required></label></div>
<div class="form-row"><label>Category<input name="category" maxlength="100" placeholder="Career, Engineering, Scholarship..."></label></div>
<div class="form-row"><label>Description<textarea name="description" maxlength="2000"></textarea></label></div>
<div class="form-row"><label>Resource URL<input name="url" type="url" maxlength="2000" placeholder="https://..." required></label></div>
<button>Publish Resource</button><div id="resource-status" role="status"></div>
</form>
<h2>Published Resources</h2><div id="resources-admin"></div>
<h2>Newsletter Subscribers</h2>
<p id="subscriber-count"></p>
<a class="button" href="/api/admin/subscribers?format=csv">Download CSV</a>
<h2>Contact Messages</h2><div id="messages-admin"></div>
</div>
</main>
<footer id="site-footer" class="footer"></footer>
<script>
const loginBox = document.getElementById("login-box"), portal = document.getElementById("portal");

function setStatus(id, text, ok = false) {
  const node = document.getElementById(id);
  node.className = "form-status " + (ok ? "success" : "error");
  node.textContent = text;
}
function el(tag, text) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  return node;
}
async function postJson(url, form) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(Object.fromEntries(new FormData(form)))
  });
  return {ok: r.ok, data: await r.json()};
}

async function check() {
  const signedIn = (await fetch("/api/admin/me")).ok;
  loginBox.hidden = signedIn;
  portal.hidden = !signedIn;
  if (signedIn) load();
}

async function load() {
  const {resources = []} = await (await fetch("/api/admin/resources")).json();
  document.getElementById("resources-admin").replaceChildren(...resources.map(x => {
    const link = el("a", x.url);
    link.href = x.url; link.target = "_blank"; link.rel = "noopener";
    const del = el("button", "Delete");
    del.style.marginLeft = ".5em";
    del.onclick = async () => {
      if (!confirm("Delete this resource?")) return;
      await fetch("/api/admin/resources?id=" + x.id, {method: "DELETE"});
      load();
    };
    const card = el("div"); card.className = "card";
    card.append(el("h3", x.title), el("p", x.description), link, del);
    return card;
  }));

  const {subscribers = []} = await (await fetch("/api/admin/subscribers")).json();
  document.getElementById("subscriber-count").textContent = subscribers.length + " active subscriber" + (subscribers.length === 1 ? "" : "s");

  const {messages = []} = await (await fetch("/api/admin/messages")).json();
  document.getElementById("messages-admin").replaceChildren(...messages.map(x => {
    const body = el("p", x.message);
    body.style.whiteSpace = "pre-wrap";
    const card = el("div"); card.className = "card";
    card.append(el("h3", x.name + " — " + x.email), body, el("small", new Date(x.created_at).toLocaleString()));
    return card;
  }));
}

document.getElementById("login-form").onsubmit = async e => {
  e.preventDefault();
  const {ok, data} = await postJson("/api/admin/login", e.currentTarget);
  if (!ok) return setStatus("login-status", data.error || "Login failed");
  check();
};

document.getElementById("logout").onclick = async () => {
  await fetch("/api/admin/logout", {method: "POST"});
  check();
};

document.getElementById("resource-form").onsubmit = async e => {
  e.preventDefault();
  const form = e.currentTarget;
  const {ok, data} = await postJson("/api/admin/resources", form);
  if (!ok) return setStatus("resource-status", data.error || "Could not publish");
  setStatus("resource-status", "Resource published.", true);
  form.reset();
  load();
};

check();
</script>
</body></html>
