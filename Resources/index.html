<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources | IEEE TAMUSA</title>
<meta name="description" content="Engineering, career, and scholarship resources shared by IEEE TAMUSA officers.">
<meta property="og:title" content="Resources | IEEE TAMUSA">
<meta property="og:description" content="Engineering, career, and scholarship resources shared by IEEE TAMUSA officers.">
<meta property="og:site_name" content="IEEE TAMUSA">
<link rel="icon" href="/cropped-tamusa_bb_Logo-Black-32x32.png">
<link rel="stylesheet" href="/style.css">
<script src="/site.js" defer></script>
</head>
<body>
<header id="site-header" class="banner"></header>
<main id="main" class="page">
<h1>Resources</h1>
<p class="page-intro">Useful links, documents, opportunities, and engineering resources shared by IEEE TAMUSA officials.</p>
<div id="resource-list" class="card-grid"><div class="notice">Loading resources...</div></div>
</main>
<footer id="site-footer" class="footer"></footer>
<script>
(async () => {
  const list = document.getElementById("resource-list");
  try {
    const r = await fetch("/api/resources");
    if (!r.ok) throw new Error("Unable to load resources.");
    const data = await r.json();
    if (!data.resources.length) {
      list.innerHTML = '<div class="notice">No resources have been posted yet.</div>';
      return;
    }
    list.innerHTML = "";
    for (const item of data.resources) {
      const card = document.createElement("article");
      card.className = "card";
      const h = document.createElement("h3"); h.textContent = item.title;
      const p = document.createElement("p"); p.textContent = item.description || "";
      const a = document.createElement("a"); a.className = "button"; a.href = item.url; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent="Open Resource";
      card.append(h,p,a);
      list.append(card);
    }
  } catch (e) {
    list.innerHTML = '<div class="notice">Resources are temporarily unavailable.</div>';
  }
})();
</script>
</body></html>
